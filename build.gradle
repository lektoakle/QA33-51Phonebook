import org.gradle.api.tasks.testing.Test

plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation("org.seleniumhq.selenium:selenium-java:4.26.0")
    implementation("org.testng:testng:7.12.0")
    implementation 'ch.qos.logback:logback-classic:1.5.13'

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'

}

test {
    useTestNG()
    systemProperty "headless", project.findProperty("headless") ?: "false"
}

}


tasks.register('qa', Test) {
    useTestNG { suites 'src/test/resources/testng.xml' }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty "headless", project.findProperty("headless") ?: "false"
    systemProperty "browser", project.findProperty("browser") ?: "chrome"
//    if (project.hasProperty('browser')) {
//        systemProperty 'browser', "${browser}"
}


tasks.register('scope', Test) {
    useTestNG {
        suites file('src/test/resources/scope.xml')
    }
    systemProperty "headless", project.findProperty("headless") ?: "false"
    systemProperty "browser", project.findProperty("browser") ?: "chrome"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

}